# Caminho: /deploy/grafana/provisioning/dashboards/dashboards.yml
# Carrega os dashboards versionados em deploy/grafana/dashboards/*.json.

apiVersion: 1

providers:
  - name: build-plan
    folder: Build-Plan
    type: file
    disableDeletion: true
    allowUiUpdates: false # a fonte da verdade é o arquivo JSON do repositório
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
