# Caminho: /sonar-project.properties
# Configuração da análise estática no SonarCloud (monorepo backend + frontend).
# A análise roda no GitHub Actions (.github/workflows/ci.yml, job "sonarcloud").
# IMPORTANTE: desative a "Automatic Analysis" no SonarCloud
# (Administration > Analysis Method), senão a análise via CI é recusada.

# ---------------------------------------------------------------------------
# Identificação — PREENCHA com os dados da sua conta no SonarCloud
# (SonarCloud > projeto > Information). Os valores abaixo seguem o padrão que o
# SonarCloud gera ao importar um repositório do GitHub: organização = usuário
# em minúsculas e chave = <Owner>_<Repo>. Confira antes do primeiro push.
# ---------------------------------------------------------------------------
sonar.organization=fernandolml
sonar.projectKey=FernandoLML_Build-Plan
sonar.projectName=Build-Plan

sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# Código-fonte e testes
# Testes ficam colocados junto ao código (backend: *.spec.ts; frontend:
# *.test.ts[x]), então as mesmas pastas aparecem em sources e tests, separadas
# por inclusions/exclusions.
# ---------------------------------------------------------------------------
sonar.sources=backend/src,frontend/src
sonar.tests=backend/src,frontend/src

sonar.test.inclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  backend/src/tests/**,\
  frontend/src/test/**

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/prisma/migrations/**,\
  frontend/src/components/ui/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  backend/src/tests/**,\
  frontend/src/test/**

# ---------------------------------------------------------------------------
# Cobertura (lcov gerado por Jest e Vitest)
# Os caminhos "SF:" de cada lcov são reescritos no CI para ficarem relativos à
# raiz do repositório (backend/src/..., frontend/src/...).
# ---------------------------------------------------------------------------
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Fora do cálculo de cobertura (mesmos critérios do jest.config.ts e do
# vite.config.ts): bootstrap, CLI do importador, tipos e entrypoints.
sonar.coverage.exclusions=\
  backend/src/server.ts,\
  backend/src/scripts/**,\
  backend/src/types/**,\
  frontend/src/main.tsx,\
  frontend/src/vite-env.d.ts,\
  frontend/src/types/**

# Duplicação: ignora testes (fábricas e cenários repetidos são intencionais).
sonar.cpd.exclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx

# Opcional: faz o job falhar quando o Quality Gate reprovar. Recomendo ligar
# depois da primeira análise, quando o gate já estiver ajustado.
# sonar.qualitygate.wait=true
