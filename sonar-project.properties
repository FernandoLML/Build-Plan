# Caminho: /sonar-project.properties
# Configuração da análise estática no SonarCloud (monorepo backend + frontend).
# A análise roda no GitHub Actions (.github/workflows/ci.yml, job "sonarcloud").
# IMPORTANTE: a "Automatic Analysis" deve ficar desativada no SonarCloud
# (Administration > Analysis Method), senão a análise via CI é recusada.

# ---------------------------------------------------------------------------
# Identificação (SonarCloud > projeto > Information)
# ---------------------------------------------------------------------------
sonar.organization=fernandolml
sonar.projectKey=FernandoLML_Build-Plan
sonar.projectName=Build-Plan

sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# Escopo da análise
# O SonarCloud usa o novo modelo de escopo: analisa o repositório inteiro e
# IGNORA sonar.sources / sonar.tests / sonar.test.inclusions (o scanner avisa
# "configured but have no effect"). O escopo é restringido só por exclusões.
# Ficam fora: dependências e artefatos, migrations e seed do Prisma (inclui a
# planilha .xlsx, que gerava o warning de encoding), assets estáticos,
# primitivos shadcn (components/ui) e o código de teste (colocado junto ao
# código: *.spec.ts no backend, *.test.ts[x] no frontend).
# ---------------------------------------------------------------------------
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  backend/prisma/**,\
  frontend/public/**,\
  frontend/src/components/ui/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  backend/src/tests/**,\
  frontend/src/test/**

# ---------------------------------------------------------------------------
# Cobertura (lcov gerado por Jest e Vitest)
# Os caminhos "SF:" de cada lcov são reescritos no CI para ficarem relativos à
# raiz do repositório (backend/src/..., frontend/src/...).
# ---------------------------------------------------------------------------
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Fora do cálculo de cobertura (mesmos critérios do jest.config.ts e do
# vite.config.ts): configuração das ferramentas, bootstrap, CLI do importador,
# tipos e entrypoints.
sonar.coverage.exclusions=\
  backend/*.config.ts,\
  backend/*.config.js,\
  frontend/*.config.ts,\
  frontend/*.config.js,\
  backend/src/server.ts,\
  backend/src/scripts/**,\
  backend/src/types/**,\
  frontend/src/main.tsx,\
  frontend/src/vite-env.d.ts,\
  frontend/src/types/**

# Duplicação: ignora testes (fábricas e cenários repetidos são intencionais).
sonar.cpd.exclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx

# Faz o job do CI falhar quando o Quality Gate reprovar (aguarda o resultado
# do processamento no SonarCloud antes de concluir o passo).
sonar.qualitygate.wait=true
