# Caminho: /.github/workflows/frontend-ci.yml
# CI do frontend (Build-Plan) — Marco M7.
# Instala, verifica tipagem, roda a suíte de testes e compila o build de produção.

name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "feature-**"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - main
      - develop
      - "feature/**"
      - "feature-**"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

# Cancela execuções anteriores ainda em curso para o mesmo ref (economiza runners).
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build (frontend)
    runs-on: ubuntu-latest

    # Todos os passos `run` executam dentro de frontend/.
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências (clean install)
        run: npm ci

      - name: Verificação estrita de tipagem
        run: npx tsc --noEmit

      - name: Executar a suíte de testes
        run: npm test

      - name: Build de produção
        run: npm run build