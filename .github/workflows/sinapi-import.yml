# Caminho: /.github/workflows/sinapi-import.yml
# Atualização mensal (batch) do catálogo SINAPI — elimina a carga manual.
# Roda o importador idempotente contra o banco de produção usando secrets.
# Também pode ser disparado manualmente (workflow_dispatch).

name: SINAPI Import

on:
  schedule:
    # 06:00 UTC no dia 5 de cada mês (margem para a Caixa publicar a referência).
    - cron: "0 6 5 * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Fonte alternativa (caminho ou URL http/https). Vazio = amostra versionada."
        required: false
        default: ""

concurrency:
  group: sinapi-import
  cancel-in-progress: false

jobs:
  import:
    name: Importar catálogo SINAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SINAPI_SOURCE: ${{ github.event.inputs.source }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js 22.x (LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Sem lifecycle scripts de dependências; só os engines do Prisma são preparados.
      - name: Instalar dependências (clean install, sem lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Preparar Prisma engines
        run: npm rebuild @prisma/engines

      - name: Gerar o Prisma Client
        run: npm run prisma:generate

      - name: Importar catálogo (replace por competência, idempotente)
        run: npm run sinapi:import