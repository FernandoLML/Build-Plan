# Caminho: /.github/workflows/ci.yml
# CI unificado do Build-Plan (substitui backend-ci.yml e frontend-ci.yml).
#   backend  → lint · typecheck · testes Jest/Supertest com cobertura (Postgres de serviço)
#   frontend → lint · typecheck · testes Vitest com cobertura · build de produção
#   sonarcloud → junta os dois lcov.info e envia a análise ao SonarCloud
#   deploy   → só na main: publica as imagens no GHCR e atualiza a EC2 (SSM)
# Backend e frontend rodam sempre juntos: o SonarCloud precisa da cobertura dos
# dois pacotes em toda análise (com filtro por pasta, um PR só de frontend
# apareceria com o backend em 0%).
#
# Hardening de supply chain (regras githubactions do SonarCloud):
#  - actions fixadas por SHA completo (a tag fica no comentário);
#  - `npm ci --ignore-scripts`: nenhum lifecycle script de dependência roda na
#    instalação; os únicos que o projeto precisa são reexecutados de forma
#    explícita e nominal com `npm rebuild <pacote>`;
#  - nenhum executor que baixe pacotes sob demanda: tudo via scripts do
#    package.json, que só usam binários já instalados pelo lockfile.

name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

# Um push novo cancela a execução anterior do mesmo ref, menos na main: lá um
# deploy em andamento termina antes de o próximo começar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint · tsc · testes + cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/buildplan_test?schema=public"
      NODE_ENV: test
      JWT_SECRET: "ci-test-secret-nao-usar-em-producao"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buildplan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js 22.x (LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências (clean install, sem lifecycle scripts)
        run: npm ci --ignore-scripts

      # Únicos install scripts necessários: binário nativo do bcrypt e engines do Prisma.
      - name: Preparar dependências nativas (bcrypt, Prisma engines)
        run: npm rebuild bcrypt @prisma/engines

      - name: Gerar o Prisma Client
        run: npm run prisma:generate

      - name: Lint (ESLint)
        run: npm run lint

      - name: Verificação estrita de tipagem
        run: npm run typecheck

      - name: Aplicar migrações no banco de teste
        run: npm run prisma:deploy

      # test:ci usa as variáveis do job (sem .env.test nem pretest) e gera coverage/lcov.info.
      - name: Testes (Jest/Supertest) com cobertura
        run: npm run test:ci

      # O lcov sai com caminhos relativos ao pacote (SF:src/...); o Sonar analisa a
      # partir da raiz do monorepo e espera SF:backend/src/...
      - name: Ajustar caminhos do lcov para a raiz do repositório
        run: sed -i 's#^SF:#SF:backend/#' coverage/lcov.info

      - name: Publicar cobertura (artefato)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend
          path: backend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend (lint · tsc · testes + cobertura · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js 22.x (LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências (clean install, sem lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Lint (ESLint)
        run: npm run lint

      - name: Verificação estrita de tipagem
        run: npm run typecheck

      - name: Testes (Vitest) com cobertura
        run: npm run test:coverage

      - name: Ajustar caminhos do lcov para a raiz do repositório
        run: sed -i 's#^SF:#SF:frontend/#' coverage/lcov.info

      - name: Publicar cobertura (artefato)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Build de produção
        run: npm run build

  sonarcloud:
    name: SonarCloud (análise estática + cobertura)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Sem o secret (ex.: PRs de forks ou antes do cadastro), o job passa sem analisar.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout do repositório (histórico completo para blame/novo código)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Baixar cobertura do backend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-backend
          path: backend/coverage

      - name: Baixar cobertura do frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-frontend
          path: frontend/coverage

      - name: SONAR_TOKEN ausente — análise ignorada
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::Secret SONAR_TOKEN não configurado; a análise do SonarCloud foi ignorada."

      # Lê a configuração de sonar-project.properties (raiz).
      - name: Análise SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_HOST_URL: https://sonarcloud.io

  # ---------------------------------------------------------------------------
  # CD: só roda em push na main, depois de testes e Quality Gate aprovados.
  #   1. constrói as imagens da API e publica no GHCR (o build sai da EC2);
  #   2. manda a EC2 executar deploy/deploy.sh pelo AWS Systems Manager (SSM).
  # Não há SSH nem chave guardada em secret: o GitHub assume uma role da AWS
  # por OIDC (credencial temporária, válida só para este repositório e branch)
  # e a porta 22 continua fechada para a internet.
  # Configuração única na AWS e no GitHub: deploy/README.md, "Deploy automático".
  deploy:
    name: Deploy (imagens no GHCR + atualização da EC2)
    runs-on: ubuntu-latest
    needs: [backend, frontend, sonarcloud]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write # publicar as imagens no GHCR
      id-token: write # token OIDC trocado por credenciais temporárias da AWS
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ghcr.io exige o nome em minúsculas: ghcr.io/fernandolml/build-plan
      - name: Definir o repositório de imagens
        run: echo "REPOSITORIO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login no GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Duas imagens do mesmo Dockerfile: `runtime` (a API, só dependências de
      # produção) e `build` (ferramentas: migrações e importador SINAPI).
      # Cada uma recebe a tag do commit (permite rollback) e `latest`.
      - name: Construir as imagens
        run: |
          docker build --target runtime \
            --tag "$REPOSITORIO-api:$GITHUB_SHA" --tag "$REPOSITORIO-api:latest" backend
          docker build --target build \
            --tag "$REPOSITORIO-tools:$GITHUB_SHA" --tag "$REPOSITORIO-tools:latest" backend

      - name: Publicar as imagens no GHCR
        run: |
          docker push --all-tags "$REPOSITORIO-api"
          docker push --all-tags "$REPOSITORIO-tools"

      - name: Variáveis da AWS ausentes — atualização da EC2 ignorada
        if: env.AWS_DEPLOY_ROLE_ARN == '' || env.EC2_INSTANCE_ID == '' || env.AWS_REGION == ''
        run: echo "::warning::Defina AWS_REGION, AWS_DEPLOY_ROLE_ARN e EC2_INSTANCE_ID (Variables do repositório) para ativar o deploy na EC2. As imagens foram publicadas."

      - name: Assumir a role de deploy na AWS (OIDC)
        if: env.AWS_DEPLOY_ROLE_ARN != '' && env.EC2_INSTANCE_ID != '' && env.AWS_REGION != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: buildplan-deploy

      # O SSM executa como root; o comando troca para o usuário `ubuntu`, dono
      # do repositório na máquina. O deploy.sh baixa as imagens, recria os
      # contêineres (migrações antes da API) e confere o health-check.
      - name: Atualizar a API na EC2 (SSM)
        if: env.AWS_DEPLOY_ROLE_ARN != '' && env.EC2_INSTANCE_ID != '' && env.AWS_REGION != ''
        run: |
          COMANDO="cd /home/ubuntu/Build-Plan && git pull --ff-only --quiet origin main && ./deploy/deploy.sh $GITHUB_SHA $REPOSITORIO"
          PARAMETROS=$(jq -cn --arg c "sudo -u ubuntu -H bash -c '$COMANDO'" \
            '{commands: [$c], executionTimeout: ["900"]}')

          ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $GITHUB_SHA" \
            --parameters "$PARAMETROS" \
            --query Command.CommandId --output text)
          echo "Comando SSM: $ID"

          # Acompanha a execução por até 15 minutos.
          for _ in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$ID" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success | Failed | Cancelled | TimedOut) break ;;
              *) ;; # Pending, InProgress, Delayed: continua aguardando
            esac
          done

          aws ssm get-command-invocation --command-id "$ID" --instance-id "$EC2_INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy na EC2 terminou com status $STATUS."
            exit 1
          fi
